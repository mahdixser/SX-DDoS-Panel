[package]
name = "sx-ddos-panel"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "sx"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1", features = ["full"] }
rand         = "0.8"
colored      = "2"
chrono       = "0.4"
serde        = { version = "1", features = ["derive"] }
socket2      = { version = "0.5", features = ["all"] }
once_cell    = "1"
parking_lot  = "0.12"
bytes        = "1"
libc         = "0.2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
